<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#070b1a">
<title>Flipwave</title>
<style>
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
--u:1px;--bg:#070b1a;--cy:#12e6ff;--mg:#ff2fd0;--vi:#7a5cff;--gold:#ffd34d;--tx:#e8f4ff;--dim:#8fa3c7;--red:#ff4d5e;--panel:rgba(9,16,40,.78);
--padt:calc(var(--sat) + 10px);--padr:calc(var(--sar) + 16px);--padb:calc(var(--sab) + 10px);--padl:calc(var(--sal) + 16px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#070b1a;overflow:hidden;touch-action:none;overscroll-behavior:none;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;color:var(--tx)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#070b1a}
#ui{position:fixed;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;margin:0}
b,strong{font-weight:800}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;padding:var(--padt) var(--padr) var(--padb) var(--padl);opacity:0;visibility:hidden;transform:scale(.985);pointer-events:none;
transition:opacity .12s ease-out,transform .12s ease-out,visibility 0s linear .12s}
.screen.on{opacity:1;visibility:visible;transform:none;pointer-events:auto;transition-delay:0s}
.screen.hud{pointer-events:none;transform:none}
.screen.hud.on .btn{pointer-events:auto}
.shade{background:radial-gradient(ellipse at 50% 50%,rgba(5,8,22,.35),rgba(5,8,22,.82))}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:48px;min-height:48px;padding:0 18px;cursor:pointer;
font-weight:800;font-size:calc(var(--u)*15);letter-spacing:.08em;text-transform:uppercase;color:var(--tx);
background:linear-gradient(180deg,rgba(26,42,92,.92),rgba(10,18,46,.92));border:2px solid rgba(18,230,255,.55);border-radius:14px;
box-shadow:0 0 14px rgba(18,230,255,.22),inset 0 0 14px rgba(18,230,255,.1);text-shadow:0 0 8px rgba(18,230,255,.35);
transition:transform .12s ease-out,box-shadow .12s,filter .12s,background .12s}
.btn:active,.btn.press{transform:scale(.95);filter:brightness(1.35);box-shadow:0 0 22px rgba(18,230,255,.55)}
.btn small{display:block;font-size:calc(var(--u)*11);font-weight:700;letter-spacing:.04em;text-transform:none;color:var(--dim);text-shadow:none}
.btn.primary{color:#06101f;text-shadow:none;border-color:rgba(255,255,255,.7);background:linear-gradient(115deg,#12e6ff,#7a5cff 58%,#ff2fd0);
box-shadow:0 0 28px rgba(18,230,255,.5),0 0 64px rgba(255,47,208,.25)}
.btn.primary:active{box-shadow:0 0 36px rgba(255,255,255,.6)}
.btn.warn{border-color:rgba(255,77,94,.8);box-shadow:0 0 16px rgba(255,77,94,.35),inset 0 0 14px rgba(255,77,94,.15)}
.btn.gold{border-color:rgba(255,211,77,.85);box-shadow:0 0 16px rgba(255,211,77,.35),inset 0 0 14px rgba(255,211,77,.12)}
.btn.dis{opacity:.45;filter:saturate(.5);box-shadow:none}
.btn.icon{padding:0;width:48px;height:48px;font-size:calc(var(--u)*20)}
.btn.big{min-height:calc(var(--u)*72);font-size:calc(var(--u)*34);letter-spacing:.14em;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:18px;font-weight:800;font-size:calc(var(--u)*16);font-variant-numeric:tabular-nums;
background:var(--panel);border:1.5px solid rgba(255,211,77,.55);color:var(--gold)}
.gem{display:inline-block;width:11px;height:11px;border-radius:2px;transform:rotate(45deg);background:linear-gradient(135deg,#fff3b0,#ffc83d 55%,#ff9a2e);box-shadow:0 0 8px rgba(255,200,60,.8);flex:none}
.gem.cy{background:linear-gradient(135deg,#d9fbff,#12e6ff 60%,#3a7bff);box-shadow:0 0 8px rgba(18,230,255,.8)}

/* ---------- studio ---------- */
.studio{align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at 50% 55%,rgba(18,230,255,.10),rgba(5,8,22,.92) 70%)}
.mark{width:calc(var(--u)*46);height:calc(var(--u)*46);border-radius:10px;background:linear-gradient(135deg,var(--cy),var(--mg));box-shadow:0 0 30px rgba(18,230,255,.7);
animation:markin .9s cubic-bezier(.2,.9,.2,1) both}
.studio-title{display:flex;margin-top:calc(var(--u)*16);font-size:calc(var(--u)*50);font-weight:900;letter-spacing:.04em}
.studio-title span{display:inline-block;opacity:0;animation:letterin .5s cubic-bezier(.2,.9,.2,1) forwards;
background:linear-gradient(180deg,#fff,#a8f4ff 55%,#12e6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(18,230,255,.55))}
.studio-title span.hot{background-image:linear-gradient(180deg,#fff,#ffb5ec 55%,#ff2fd0);filter:drop-shadow(0 0 12px rgba(255,47,208,.6))}
.studio-sub{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*12);letter-spacing:.5em;color:var(--dim);text-transform:uppercase;opacity:0;animation:fadein .5s .9s forwards}
.sweep{position:relative;width:calc(var(--u)*220);height:3px;margin-top:calc(var(--u)*14);border-radius:2px;background:linear-gradient(90deg,transparent,var(--cy),var(--mg),transparent);transform:scaleX(0);animation:sweep .7s .55s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes markin{from{transform:translateY(-30px) rotate(-90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes letterin{from{opacity:0;transform:translateY(calc(var(--u)*18)) scale(.85)}to{opacity:1;transform:none}}
@keyframes fadein{to{opacity:1}}
@keyframes sweep{to{transform:scaleX(1)}}

/* ---------- main menu ---------- */
.menu{align-items:center;justify-content:space-between;gap:calc(var(--u)*24);background:linear-gradient(90deg,rgba(5,8,22,.62),rgba(5,8,22,.18) 55%,rgba(5,8,22,.5))}
.menu-left{flex:1.05;display:flex;flex-direction:column;justify-content:center;min-width:0}
.logo{font-size:calc(var(--u)*62);font-weight:900;line-height:.9;letter-spacing:.02em;
background:linear-gradient(180deg,#fff,#a8f4ff 50%,#12e6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(18,230,255,.5))}
.logo i{display:block;font-style:normal;background:linear-gradient(180deg,#fff,#ffb5ec 50%,#ff2fd0);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:calc(var(--u)*8);font-size:calc(var(--u)*14);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.statline{margin-top:calc(var(--u)*18);display:flex;align-items:center;gap:calc(var(--u)*10);flex-wrap:wrap;font-size:calc(var(--u)*14);color:var(--dim);font-variant-numeric:tabular-nums}
.statline b{color:var(--tx);font-size:calc(var(--u)*17)}
.statline .sep{opacity:.5}
.menu-right{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*10);max-width:calc(var(--u)*330)}
.menu-right .play{width:100%}
.menu-right .daily{width:100%;min-height:calc(var(--u)*56);flex-direction:column;gap:0;border-color:rgba(255,211,77,.7);box-shadow:0 0 14px rgba(255,211,77,.22),inset 0 0 14px rgba(255,211,77,.1);line-height:1.15}
.menu-right .daily small b{color:var(--gold)}
.row3{display:flex;gap:calc(var(--u)*8)}
.row3 .btn{flex:1;padding:0 6px;font-size:calc(var(--u)*13);letter-spacing:.05em}
.menu-top{position:absolute;top:var(--padt);right:var(--padr);display:flex;gap:10px;align-items:center}

/* ---------- HUD ---------- */
.hud{padding:0}
.hud .hp{position:absolute;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 12px)}
.pauseic{display:flex;gap:5px}
.pauseic i{display:block;width:5px;height:18px;border-radius:2px;background:var(--tx);box-shadow:0 0 8px rgba(18,230,255,.8)}
.hud .hd{position:absolute;top:calc(var(--sat) + 3px);line-height:1.08;left:50%;transform:translateX(-50%);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.hd b{font-size:calc(var(--u)*30);font-weight:900;letter-spacing:.02em;text-shadow:0 0 14px rgba(18,230,255,.75),0 2px 0 rgba(0,0,0,.35)}
.hd span{font-size:calc(var(--u)*15);font-weight:800;color:var(--cy);margin-left:3px;text-shadow:0 0 8px rgba(18,230,255,.6)}
.hud .hr{position:absolute;top:calc(var(--sat) + 8px);right:calc(var(--sar) + 14px);display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.hr .hrow{display:flex;align-items:center;gap:8px}
.hr .sh{font-size:calc(var(--u)*22);font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 10px rgba(255,200,60,.6),0 2px 0 rgba(0,0,0,.35);display:inline-block}
.hr .sh.pop{animation:pop .14s ease-out}
.hr .mult{font-size:calc(var(--u)*20);font-weight:900;color:#06101f;padding:1px 9px 2px;border-radius:10px;background:linear-gradient(115deg,#12e6ff,#ff2fd0);opacity:0;transition:opacity .12s;box-shadow:0 0 14px rgba(18,230,255,.6)}
.hr .mult.on{opacity:1}
.hr .mult.up{animation:pop .16s ease-out}
.hr .bar{width:calc(var(--u)*86);height:5px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;transition:opacity .12s}
.hr .bar.on{opacity:1}
.hr .bar i{display:block;height:100%;width:100%;transform-origin:0 50%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.hr .pw{display:flex;gap:6px;min-height:22px}
.hr .pw span{font-size:calc(var(--u)*11);font-weight:900;letter-spacing:.08em;padding:3px 8px;border-radius:9px;border:1.5px solid;background:rgba(5,8,22,.55);display:none}
.hr .pw .s{color:#7dffb0;border-color:#7dffb0}
.hr .pw .m{color:#ff9bf0;border-color:#ff9bf0}
.hr .pw span.on{display:block}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}
.hint{position:absolute;left:50%;top:60%;transform:translate(-50%,6px);opacity:0;pointer-events:none;white-space:nowrap;font-size:calc(var(--u)*30);font-weight:900;letter-spacing:.12em;text-transform:uppercase;
text-shadow:0 0 18px rgba(18,230,255,.9),0 2px 0 rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
.hint.on{opacity:1;transform:translate(-50%,0)}
.hint.pulse{animation:hintp 1.1s ease-in-out infinite}
@keyframes hintp{50%{letter-spacing:.17em}}
.toast{position:absolute;left:50%;top:calc(var(--sat) + 56px);transform:translate(-50%,-6px);opacity:0;pointer-events:none;white-space:nowrap;padding:6px 16px;border-radius:16px;font-weight:900;letter-spacing:.08em;
font-size:calc(var(--u)*16);color:var(--gold);background:var(--panel);border:1.5px solid rgba(255,211,77,.7);box-shadow:0 0 18px rgba(255,200,60,.35);transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- pause ---------- */
.pausescr{align-items:center;justify-content:center}
.panel{background:var(--panel);border:1.5px solid rgba(18,230,255,.35);border-radius:22px;padding:calc(var(--u)*18) calc(var(--u)*22);box-shadow:0 0 40px rgba(0,0,0,.5),0 0 28px rgba(18,230,255,.12);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pausebox{display:flex;flex-direction:column;align-items:stretch;gap:calc(var(--u)*10);width:calc(var(--u)*290)}
.pausebox h2{margin:0 0 4px;text-transform:uppercase;text-align:center;font-size:calc(var(--u)*26);letter-spacing:.3em;text-indent:.3em}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:calc(var(--u)*130);font-weight:900;color:#fff;text-shadow:0 0 40px rgba(18,230,255,.9);opacity:0}
.count.on{opacity:1}
.count.tick{animation:ctick .6s ease-out both}
@keyframes ctick{0%{transform:scale(1.6);opacity:0}25%{opacity:1}100%{transform:scale(.9);opacity:.9}}

/* ---------- result ---------- */
.result{align-items:center;justify-content:space-between;gap:calc(var(--u)*22)}
.res-left{flex:1.25;min-width:0;display:flex;flex-direction:column;justify-content:center}
.res-mode{font-size:calc(var(--u)*12);letter-spacing:.3em;color:var(--gold);text-transform:uppercase;height:calc(var(--u)*16)}
.res-dist{font-size:calc(var(--u)*76);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(18,230,255,.65)}
.res-dist small{font-size:calc(var(--u)*26);color:var(--cy);margin-left:6px}
.newbest{display:inline-block;margin:calc(var(--u)*8) 0 calc(var(--u)*4);font-size:calc(var(--u)*17);font-weight:900;letter-spacing:.2em;color:#06101f;padding:3px 12px 4px;border-radius:12px;background:linear-gradient(115deg,#ffd34d,#ff7ac8);
box-shadow:0 0 22px rgba(255,200,80,.7);visibility:hidden}
.newbest.on{visibility:visible;animation:nb 1.3s ease-in-out infinite}
@keyframes nb{0%,100%{transform:scale(1);box-shadow:0 0 18px rgba(255,200,80,.5)}50%{transform:scale(1.07);box-shadow:0 0 30px rgba(255,200,80,.85)}}
.burst{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.res-stats{display:flex;gap:calc(var(--u)*20);margin-top:calc(var(--u)*6);font-variant-numeric:tabular-nums}
.res-stats div{font-size:calc(var(--u)*11);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.res-stats b{display:block;text-transform:none;font-size:calc(var(--u)*22);letter-spacing:0;color:var(--tx);margin-top:1px}
.res-stats b.g{color:var(--gold)}
.res-miss{margin-top:calc(var(--u)*12);font-size:calc(var(--u)*13);line-height:1.35;color:var(--dim);max-width:calc(var(--u)*330)}
.res-miss .done{color:#7dffb0;font-weight:800}
.res-miss .mb{height:4px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:3px;overflow:hidden}
.res-miss .mb i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.res-right{flex:.8;display:flex;flex-direction:column;gap:calc(var(--u)*12);max-width:calc(var(--u)*280)}
.res-right .retry{width:100%;min-height:calc(var(--u)*110);font-size:calc(var(--u)*40);border-radius:24px}
.res-right .menu-b{width:100%}

/* ---------- pages (skins / missions / settings / about) ---------- */
.page{flex-direction:column;gap:calc(var(--u)*8);background:rgba(5,8,22,.68)}
.page-head{display:flex;align-items:center;gap:12px;flex:none;min-height:48px}
.page-head h2{margin:0;flex:1;font-size:calc(var(--u)*22);letter-spacing:.22em;text-transform:uppercase}
.page-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 2px 8px;scrollbar-width:none}
.page-body::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*122),1fr));gap:calc(var(--u)*10)}
.skin{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 8px;border-radius:16px;background:var(--panel);border:2px solid rgba(143,163,199,.25);text-align:center}
.skin canvas{width:calc(var(--u)*96);height:calc(var(--u)*56);display:block}
.skin .nm{font-size:calc(var(--u)*13);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.skin .btn{width:100%;min-height:44px;font-size:calc(var(--u)*13);padding:0 6px;border-radius:12px}
.skin.eq{border-color:var(--cy);box-shadow:0 0 18px rgba(18,230,255,.35)}
.skin.locked canvas{opacity:.8;filter:grayscale(.35)}
.skin.can{border-color:rgba(255,211,77,.7)}
.skin.poor .btn{opacity:.5}
.mgrid{display:flex;gap:calc(var(--u)*14);align-items:stretch}
.mcol{flex:1.35;display:flex;flex-direction:column;gap:calc(var(--u)*9);min-width:0}
.scol{flex:.8;min-width:0}
.mcard{padding:calc(var(--u)*10) calc(var(--u)*14);border-radius:16px;background:var(--panel);border:1.5px solid rgba(18,230,255,.35)}
.mcard .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:calc(var(--u)*15);letter-spacing:.02em}
.mcard .t .chip{height:28px;padding:0 10px;font-size:calc(var(--u)*13)}
.mcard .b{height:7px;border-radius:4px;background:rgba(255,255,255,.13);margin-top:8px;overflow:hidden}
.mcard .b i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));border-radius:4px}
.mcard .p{margin-top:4px;font-size:calc(var(--u)*12);color:var(--dim);font-variant-numeric:tabular-nums}
.stats{padding:calc(var(--u)*10) calc(var(--u)*14);border-radius:16px;background:var(--panel);border:1.5px solid rgba(143,163,199,.3)}
.stats h3{margin:0 0 6px;font-size:calc(var(--u)*12);letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
.stats div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid rgba(143,163,199,.15);font-size:calc(var(--u)*14);color:var(--dim)}
.stats div:first-of-type{border-top:0}
.stats b{color:var(--tx);font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*10)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:calc(var(--u)*58);padding:6px 14px;border-radius:16px;background:var(--panel);border:1.5px solid rgba(143,163,199,.28)}
.row .l{font-weight:800;font-size:calc(var(--u)*14);letter-spacing:.08em;text-transform:uppercase;min-width:0}
.row .l small{display:block;font-size:calc(var(--u)*10.5);letter-spacing:.02em;text-transform:none;color:var(--dim);font-weight:600;margin-top:1px}
.row.act{padding:0;background:none;border:0}
.row.act .btn{width:100%;height:100%;min-height:calc(var(--u)*58)}
input[type=range]{-webkit-appearance:none;appearance:none;width:calc(var(--u)*130);height:44px;background:transparent;margin:0;touch-action:pan-x}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cy) var(--v,50%),rgba(255,255,255,.18) var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(18,230,255,.9)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--cy)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.tog{position:relative;width:58px;height:34px;flex:none;padding:0;border-radius:17px;border:2px solid rgba(143,163,199,.5);background:rgba(255,255,255,.08);cursor:pointer;transition:background .12s,border-color .12s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#cfd8ee;transition:transform .12s,background .12s}
.tog.on{border-color:var(--cy);background:rgba(18,230,255,.28)}
.tog.on::after{transform:translateX(24px);background:#fff;box-shadow:0 0 10px rgba(18,230,255,.9)}
.tog::before{content:"";position:absolute;inset:-6px -4px}

.page.about{background:rgba(5,8,22,.84)}
.aboutbox{margin:auto;text-align:center;max-width:calc(var(--u)*420)}
.aboutbox .logo{font-size:calc(var(--u)*46)}
.aboutbox .logo i{display:inline}
.aboutbox p{margin:calc(var(--u)*8) 0;font-size:calc(var(--u)*15);line-height:1.4;color:var(--dim)}
.aboutbox p b{color:var(--tx)}
.aboutbox .nd{color:var(--tx);font-weight:800;padding:8px 14px;border-radius:14px;border:1.5px solid rgba(125,255,176,.6);background:rgba(125,255,176,.07)}
.reduced *,.reduced *::before,.reduced *::after{animation-duration:.001s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){.newbest.on,.hint.pulse,.mark{animation:none}}
@keyframes sparkout{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.harrow{position:absolute;top:50%;transform:translateY(-50%);font-size:calc(var(--u)*120);font-weight:900;line-height:.7;color:#fff;opacity:0;pointer-events:none;text-shadow:0 0 24px rgba(18,230,255,.95);transition:opacity .2s}
.harrow.l{left:calc(var(--sal) + 22px)}.harrow.r{right:calc(var(--sar) + 22px)}
.harrow.on{opacity:.75;animation:arrowp 1s ease-in-out infinite}
.harrow.l.on{--ax:-8px}.harrow.r.on{--ax:8px}
@keyframes arrowp{50%{opacity:.35;transform:translate(var(--ax),-50%)}}
.row.wide{grid-column:1/-1}

  const INW_Y = [1, 0, -1, 0], INW_Z = [0, -1, 0, 1];   // inward unit vector per wall (world Y, Z)
  function drawPlayer(g, skin, pa, pb, dt, tm) {
    const w = g.P.w, iy = INW_Y[w], iz = INW_Z[w];
    // squash / stretch along the gravity axis (anchored on the wall)
    let sg = 1;
    if (squashT > 0) sg -= 0.25 * squashAmp * (squashT / 0.09);

    const px = g.dead ? g.x : g.px + (g.x - g.px) * curAlpha;
    const X = px - OX;
    const cy0 = CH - pb, cz0 = pa - ZW;
    const cy = cy0 + iy * shift, cz = cz0 + iz * shift;
    let rx = 0;
    if (tumbleT > 0) { const k = tumbleT / 0.3; rx = tumbleDir * 1.5708 * k * k; }

      trailAcc += dt;

    if (g.dead) return;
    const f = skinFl(skin);
    const mult = g.mult || 1;

      const m0 = Math.max(1, n - 12);
      for (let i = m0; i < n; i++) bline(batchAdd, CELL_SOLID, 1, 1, 1, Math.min(1, flipT / 0.1) * 0.6, linX[i - 1], linY[i - 1], linZ[i - 1], linX[i], linY[i], linZ[i], 2.2);

    const lat = (w & 1) ? cy0 - ZW : cz0;

    const sh = Math.max(0, 1 - Math.max(0, depth - 11) / 260);

    wq(batchAlp, CELL_GLOW, 0, 0, 0, 0.55 * sh, w, X - 20, X + 20, lat - 20, lat + 20, 0.7);
    if (g.magnetT > 0) {
      const warn = g.magnetT < 1.5 ? (0.45 + 0.55 * Math.abs(Math.sin(tm * 9))) : 1;

      }

    }

      }

    useMeshProgram(1);

    const gy = (w & 1) ? sl : sg, gz = (w & 1) ? sg : sl;

  /* ---- particles -> billboards ---- */
  function particlesToBatches(tm) {
    const n = parts.count, a = PA;
    for (let i = 0; i < n; i++) {
      const k = a.kind[i];
      const life = a.life[i] / a.max[i];
      const c = colOf(a.col[i]);
      const x = a.x[i] - OX, y = a.y[i], z = a.z[i], s = a.size[i];
      switch (k) {
        case K.DUST: bb(batchAlp, CELL_GLOW, c[0], c[1], c[2], life * 0.55, x, y, z, s * (1.3 + (1 - life) * 1.8), s * (1.3 + (1 - life) * 1.8), 0); break;
        case K.SPARK: bline(batchAdd, CELL_SOLID, c[0], c[1], c[2], life > 0.5 ? 1 : life * 2, x, y, z, x - a.vx[i] * 0.045, y - a.vy[i] * 0.045, z - a.vz[i] * 0.045, s); break;
        case K.SHARD: bb(batchAlp, CELL_SOLID, c[0], c[1], c[2], life > 0.35 ? 1 : life / 0.35, x, y, z, s * 1.05, s * 1.05, a.rot[i]); break;

        case K.RING: bb(batchAdd, CELL_RING, c[0], c[1], c[2], life * 0.9, x, y, z, Math.max(0.5, a.rot[i]), Math.max(0.5, a.rot[i]), 0); break;
        case K.DOT: bb(batchAdd, CELL_GLOW, c[0], c[1], c[2], life, x, y, z, Math.max(0.5, s * (0.6 + 0.8 * life)), Math.max(0.5, s * (0.6 + 0.8 * life)), 0); break;
        case K.FLY: bb(batchAdd, CELL_GLOW, c[0], c[1], c[2], 1, x, y, z, s * 2.2, s * 2.2, 0); break;
        case K.BUBBLE: bb(batchAlp, CELL_RING, c[0], c[1], c[2], life * 0.7, x, y, z, s * (1 + (1 - life) * 0.8), s * (1 + (1 - life) * 0.8), 0); break;

  }

  /* ---- HUD overlays ---- */
  function drawHud(view) {
    hudProgramBegin();
    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const b = batchHud;
    let any = false;
    if (washT > 0 && !reduce) {
      const k = 1 - washT / 1.2, a = Math.sin(k * 3.14159) * 0.2;
      const ac = TH.themeFor(washZone).c.accent;
      bq(b, CELL_SOLID, ac[0] / 255, ac[1] / 255, ac[2] / 255, a, -1, 1, 0, 1, 1, 0, 1, -1, 0, -1, -1, 0);
      any = true;
    }
    if (view.fade > 0) {
      bq(b, CELL_SOLID, 0.01, 0.012, 0.04, Math.min(1, view.fade) * 0.88, -1, 1, 0, 1, 1, 0, 1, -1, 0, -1, -1, 0);
      any = true;
    }
    if (any) flushBatch(b, false, atlas);
    // soft local flashes (additive, never full-screen white)
    if (!reduce && (portalFlash > 0 || deathFlash > 0)) {
      gl.blendFunc(gl.ONE, gl.ONE);

      if (deathFlash > 0) { const f = deathFlash / 0.25; bbHud(batchAdd, CELL_GLOW, 1, 0.9, 0.8, f * 0.55, 0, 0, 0.8, 0.8); bbHud(batchAdd, CELL_GLOW, 1, 0.4, 0.2, f * 0.4, 0, 0, 1.3, 1.3); }
      flushBatch(batchAdd, true, atlas);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    }
    // banner
    if (bannerT > 0) {
      if (bannerDirty) renderBanner();
      const el = 1.8 - bannerT;
      const a = Math.min(1, el / 0.2) * Math.min(1, bannerT / 0.45);
      const sc = 0.92 + 0.08 * Math.min(1, el / 0.3);

    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    const th = TH.themeFor(bannerZone).c;
    c.font = '800 66px ' + FONT;
    c.lineWidth = 12; c.strokeStyle = TH.css(th.accent); c.globalAlpha = 0.4;
    c.strokeText('ZONE ' + bannerN, 256, 48);
    c.globalAlpha = 1; c.fillStyle = '#ffffff'; c.fillText('ZONE ' + bannerN, 256, 48);
    c.font = '700 26px ' + FONT; c.fillStyle = TH.css(th.accent2);

  /* ---- timers, measure, shake ---- */
  function tickTimers(dt) {
    squashT = squashT > dt ? squashT - dt : 0;
    flipT = flipT > dt ? flipT - dt : 0;
    tumbleT = tumbleT > dt ? tumbleT - dt : 0;
    washT = washT > dt ? washT - dt : 0;
    bannerT = bannerT > dt ? bannerT - dt : 0;
    deathFlash = deathFlash > dt ? deathFlash - dt : 0;
    portalFlash = portalFlash > dt ? portalFlash - dt : 0;
    shieldPulse = shieldPulse > dt ? shieldPulse - dt : 0;
    perfectFlash = perfectFlash > dt ? perfectFlash - dt : 0;
    camKick = camKick > dt ? camKick - dt * 4 : 0;
    if (shakeAmp > 0.05) { shakeAmp *= Math.exp(-dt * 9); shakeT += dt; } else shakeAmp = 0;
    if (reduce || shakeAmp <= 0) { shakeOut.x = 0; shakeOut.y = 0; }
    else { const a = Math.min(6, shakeAmp); shakeOut.x = Math.sin(shakeT * 83 + 1.3) * a; shakeOut.y = Math.sin(shakeT * 97 + 4.1) * a; }
  }
  const SCALES = [0.72, 0.86, 1];
  function measure(now) {
    if (lastNow) {
      const iv = now - lastNow;
      if (iv > 0 && iv < 250) {
        ivEma += (iv - ivEma) * 0.06;
        winSum += iv; winN++;
        if (winSum >= 1000 && !qLock) {
          const avg = winSum / winN;
          const q0 = quality;
          if (avg > 20 && quality > 0) { quality--; qGood = 0; }
          else if (avg < 18 && quality < 2) { if (++qGood >= 4) { quality++; qGood = 0; } }
          else if (avg >= 18) qGood = 0;
          if (quality !== q0) { scaleQ = SCALES[quality]; applySize(); }
          winSum = 0; winN = 0;
        }
      }
    }
    lastNow = now;
  }

  /* ---- frame ---- */
  const DEF_VIEW = { skin: 'cyan_core', reduceFx: false, bestMeters: 0, dt: 1 / 60, fade: 0 };

  function beginFrame() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.clearColor(fogCol[0], fogCol[1], fogCol[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  }

  function renderScene(chunks, ci, px, cy, cz, tm, dt, g, view, speed) {
    const x0v = px - CAM_BACK - 150, x1v = px + 2400;
    OX = Math.floor(px / 1024) * 1024;
    collectVisible(chunks, ci, x0v - 300, x1v);
    if (nvis === 0) { gl.clearColor(0.03, 0.04, 0.09, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    computeZones(chunks, px, g ? g.zone : 1);
    setFog();
    setupCamera(px, cy, cz, dt, speed);
    beginFrame();
    batchAdd.n = 0; batchAlp.n = 0; batchHud.n = 0;
    hudProgramBegin();
    gl.disable(gl.DEPTH_TEST); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    drawSkyWrapper(tm);
    gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST);
    useMeshProgram(1);
    drawChunksStatic(chunks, px, frameNo < 4 ? 20 : 1);
    drawDynamicHazards(chunks, px, tm, x0v, x1v);
    addHazardFx(chunks, px, tm, x0v, x1v);
    drawPickups(chunks, px, tm, x0v, x1v, g);
    if (g && view) drawFlag(px, tm, view.bestMeters || 0, x0v, x1v);
    if (g) drawPlayer(g, SK.skinById(view.skin), curA, curB, dt, tm);
    particlesToBatches(tm);
    useBillboardProgram();
    gl.depthMask(false); gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    flushBatch(batchAlp, false, atlas);

    flushBatch(batchAdd, true, atlas);
    gl.disable(gl.BLEND); gl.depthMask(true);
  }
  function drawSkyWrapper(tm) {
    // sky uses batchHud (alpha gradient) and batchAdd (glows); reset after use
    drawSky(tm);
    batchAdd.n = 0; batchHud.n = 0;
  }

  function draw(g, alpha, view) {
    const t0 = performance.now();
    view = view || DEF_VIEW;
    if (view.skin) curSkinId = view.skin;
    frameNo++;
    const dt = view.dt === undefined ? 1 / 60 : view.dt;
    reduce = view.reduceFx === undefined ? reduceSet : (view.reduceFx || reduceSet);
    measure(t0);
    parts.setLimit(reduce ? 100 : quality >= 2 ? 480 : quality === 1 ? 280 : 150);
    animT += dt;
    tickTimers(dt);
    curAlpha = g.dead ? 1 : alpha;
    let px, pa, pb;
    if (g.dead) { px = g.x; pa = g.a; pb = g.b; }
    else { px = g.px + (g.x - g.px) * alpha; pa = g.pa + (g.a - g.pa) * alpha; pb = g.pb + (g.b - g.pb) * alpha; }
    curA = pa; curB = pb;
    // roll target follows the gravity wall (shortest way, never wraps)
    const w = g.P.w;
    rollMode = reduce ? 0 : (view.rollMode === undefined ? 1 : view.rollMode);
    // cumulative, unwrapped turn count (right +1, left -1): the camera keeps rotating the same way, never "reorients"
    if (!camInit) cumTurns = w;
    else {
      const exp = ((cumTurns % 4) + 4) & 3;
      if (exp !== w) { const d = (w - exp) & 3; cumTurns += d === 3 ? -1 : 1; }   // safety net if an event was missed
    }
    // keep the numbers bounded: shift target and spring state together by whole turns (360 deg)
    // keep the numbers bounded: shift target and spring state together by whole turns
    while (thUnw >= 12.566370614) { thUnw -= 12.566370614; roll += 12.566370614; }
    while (thUnw <= -12.566370614) { thUnw += 12.566370614; roll -= 12.566370614; }
    // camera roll follows the cube's REAL angle around the tube axis (continuous, unwrapped): the cube stays near the bottom of the screen
    // during the whole turn and the roof keeps rotating the same way. No lag-vs-cube mismatch = smooth.
    {
      let th = Math.atan2(pa - 144, pb - 144);
      th += 6.283185307 * Math.round((thUnw - th) / 6.283185307);
      thUnw = th;
      rollT = rollMode === 0 ? 0 : -th;
      if (!camInit) { roll = rollT; rollV = 0; }
    }
    const cy = CH - pb, cz = pa - ZW;
    parts.update(dt, px, cy, cz);
    renderScene(g.corr.chunks, g.ci, px, cy, cz, animT, dt, g, view, g.speed || 300);
    if (!g.dead && g.P.grounded && quality >= 1 && !reduce) {
      sparkleAcc += dt;
      if (sparkleAcc > 0.07) {
        sparkleAcc = 0;
        const iy = INW_Y[w], iz = INW_Z[w];
        parts.spawn(K.DOT, px - 8, cy - iy * 12, cz - iz * 12, -g.speed * 0.2 - rnd() * 30, iy * (10 + rnd() * 30) + (rnd() - 0.5) * 20 * iz, iz * (10 + rnd() * 30) + (rnd() - 0.5) * 20 * iy, 0.25, 1.3, C_WHITE, 0, 1, 0, 0);
      }
    }
    drawHud(view);
    cleanCache();
    drawMsEma += (performance.now() - t0 - drawMsEma) * 0.08;
  }
